<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>S.W.O.R.D. Secure Facility Maze</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap');

    :root{
      --bg:#030a12;
      --panel:#070d1a;
      --wall:#0c1a2c;
      --wall2:#162438;
      --path:#040d18;
      --gold:#d4a642;
      --gold2:#ffca58;
      --goldA:rgba(212,166,66,.26);
      --green:#22c55e;
      --greenA:rgba(34,197,94,.24);
      --red:#ef4444;
      --redA:rgba(239,68,68,.30);
      --amber:#f59e0b;
      --txt:#a8c0da;
      --dim:#344f62;
      --border:#172c42;
      --blue:#3b82f6;
      --finalCode:#91483;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%}
    body{
      background:
        radial-gradient(circle at 12% 8%, rgba(59,130,246,.16), transparent 28%),
        radial-gradient(circle at 86% 18%, rgba(212,166,66,.13), transparent 24%),
        radial-gradient(circle at 50% 108%, rgba(34,197,94,.10), transparent 35%),
        #030a12;
      color:var(--txt);
      font-family:'Share Tech Mono',monospace;
      overflow:hidden;
    }

    @keyframes blink{0%,100%{opacity:1}50%{opacity:.18}}
    @keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
    @keyframes cpPulse{0%,100%{opacity:1;box-shadow:0 0 5px rgba(212,166,66,.26),0 0 10px rgba(212,166,66,.13)}50%{opacity:.48;box-shadow:0 0 12px rgba(212,166,66,.62),0 0 24px rgba(212,166,66,.32)}}
    @keyframes exitPulse{0%,100%{box-shadow:0 0 8px rgba(34,197,94,.28)}50%{box-shadow:0 0 18px rgba(34,197,94,.70),0 0 32px rgba(34,197,94,.32)}}
    @keyframes guardPulse{0%,100%{box-shadow:0 0 8px rgba(239,68,68,.30),0 0 16px rgba(239,68,68,.15);transform:scale(1)}50%{box-shadow:0 0 20px rgba(239,68,68,.74),0 0 34px rgba(239,68,68,.40);transform:scale(1.15)}}
    @keyframes timerGlow{0%,100%{text-shadow:0 0 6px rgba(239,68,68,.5)}50%{text-shadow:0 0 18px rgba(239,68,68,1)}}
    @keyframes sweep{from{transform:translateX(-120%) skewX(-18deg)}to{transform:translateX(260%) skewX(-18deg)}}
    @keyframes cameraSweep{0%{transform:rotate(-35deg)}50%{transform:rotate(35deg)}100%{transform:rotate(-35deg)}}
    @keyframes cctvFlicker{0%,100%{opacity:1}93%{opacity:1}93.5%{opacity:.72}94%{opacity:1}97%{opacity:.85}}
    @keyframes scanDown{0%{transform:translateY(-100%);opacity:0}12%{opacity:.7}100%{transform:translateY(100%);opacity:0}}
    @keyframes codePop{0%{transform:scale(.2) rotate(-12deg);opacity:0}62%{transform:scale(1.18) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
    @keyframes defused{0%{letter-spacing:.05em;opacity:0;filter:blur(12px)}100%{letter-spacing:.35em;opacity:1;filter:blur(0)}}
    @keyframes accessBar{from{width:0}to{width:100%}}

    .scanlines{
      position:fixed;inset:0;
      background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.055) 3px,rgba(0,0,0,.055) 4px);
      pointer-events:none;z-index:200;
    }

    .root{
      background:
        linear-gradient(90deg, rgba(59,130,246,.018) 1px, transparent 1px),
        linear-gradient(0deg, rgba(59,130,246,.014) 1px, transparent 1px),
        var(--bg);
      background-size:42px 42px,42px 42px,auto;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      font-family:'Share Tech Mono',monospace;
      user-select:none;
      -webkit-user-select:none;
      overflow:hidden;
      position:relative;
    }

    .root::before{
      content:"";
      position:fixed;inset:0;
      background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.68) 100%);
      pointer-events:none;
      z-index:100;
    }

    .toast{
      position:fixed;top:54px;left:50%;transform:translateX(-50%);
      padding:8px 18px;border-radius:999px;
      font-size:10px;letter-spacing:2px;z-index:300;white-space:nowrap;
      animation:none;
      backdrop-filter:blur(8px);
    }

    .top-hud{
      background:rgba(4,11,22,.94);
      border-bottom:1px solid var(--border);
      padding:8px 10px;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      gap:10px;
      align-items:center;
      flex-shrink:0;
      position:relative;
      z-index:20;
    }
    .brand{
      min-width:80px;
    }
    .brand-title{
      color:var(--gold);
      font-family:'Orbitron',sans-serif;
      font-size:11px;
      letter-spacing:3px;
      font-weight:900;
    }
    .brand-sub{
      color:var(--dim);
      font-size:7px;
      letter-spacing:1px;
      margin-top:2px;
    }
    .brand-sub.danger{color:var(--red)}

    .cp-pips{
      display:flex;
      gap:5px;
      flex-wrap:wrap;
      justify-content:center;
      max-width:190px;
    }
    .cp-pip{
      width:10px;height:10px;
      transform:rotate(45deg);
      background:var(--dim);
      border:1px solid rgba(255,255,255,.04);
      transition:all .25s;
    }
    .cp-pip.done{
      background:var(--green);
      box-shadow:0 0 8px var(--green);
    }

    .timer-box{text-align:right;min-width:92px}
    .timer{
      color:var(--green);
      font-family:'Orbitron',sans-serif;
      font-size:17px;
      font-weight:900;
      font-variant-numeric:tabular-nums;
      letter-spacing:1px;
      transition:color .45s;
    }
    .timer.low{color:var(--red);animation:none}
    .timer-bar{
      height:4px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:3px;
    }
    .timer-fill{height:100%;background:var(--green);transition:background .45s}
    .reset-btn{
      background:transparent;border:none;color:var(--dim);
      font-size:7px;letter-spacing:1px;cursor:pointer;font-family:inherit;padding:0;margin-top:3px;
    }

    .surveillance-row{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:8px;
      padding:8px 10px 0;
      flex-shrink:0;
      position:relative;
      z-index:10;
    }
    .cam{
      height:52px;
      background:linear-gradient(180deg,rgba(7,13,26,.96),rgba(2,7,14,.92));
      border:1px solid var(--border);
      border-radius:6px;
      position:relative;
      overflow:hidden;
      animation:none;
    }
    .cam::before{
      content:"";
      position:absolute;inset:0;
      background:
        repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.04) 3px 4px),
        radial-gradient(circle at 20% 20%,rgba(59,130,246,.18),transparent 36%);
    }
    .cam::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(135deg, rgba(212,166,66,.07), transparent 60%);
      opacity:.8;
    }
    .cam-label{
      position:absolute;left:7px;top:5px;
      color:var(--gold);font-size:7px;letter-spacing:2px;z-index:2;
    }
    .cam-status{
      position:absolute;right:7px;bottom:5px;
      color:var(--green);font-size:7px;letter-spacing:1px;z-index:2;
    }

    .maze-wrap{
      flex:1;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:8px 6px;
      overflow:auto;
      position:relative;
      z-index:2;
    }
    .maze{
      display:grid;
      border:2px solid var(--border);
      border-radius:6px;
      overflow:hidden;
      width:100%;
      max-width:min(720px,calc(100vw - 12px));
      box-shadow:0 0 70px rgba(0,0,0,.9),0 0 36px rgba(59,130,246,.08);
      background:#000;
    }
    .cell{
      aspect-ratio:1;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .wall{
      background:linear-gradient(135deg,var(--wall2),var(--wall));
    }
    .wall::before{
      content:"";
      position:absolute;inset:0;
      background-image:radial-gradient(circle,rgba(255,255,255,.026) 1px,transparent 1px);
      background-size:6px 6px;
    }
    .path{background:var(--path)}
    .checkpoint-path{background:#100800}
    .checkpoint-cleared{background:#051309}
    .exit-path{background:#041008}

    .threat::after{
      content:"";
      position:absolute;inset:0;
      background:rgba(239,68,68,var(--threatA));
      pointer-events:none;
    }

    .cp-diamond{
      width:clamp(4px,48%,15px);
      height:clamp(4px,48%,15px);
      transform:rotate(45deg);
      border-radius:1px;
      background:var(--gold);
      box-shadow:0 0 6px var(--goldA);
      animation:none;
      z-index:2;
    }
    .cp-diamond.done{
      background:var(--green);
      box-shadow:0 0 7px var(--greenA);
      animation:none;
    }

    .exit{
      width:clamp(6px,48%,16px);
      height:clamp(6px,48%,16px);
      border-radius:50%;
      border:2px solid var(--dim);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--dim);
      font-size:clamp(3px,1.2vmin,8px);
      z-index:2;
    }
    .exit.ready{
      border-color:var(--green);
      color:var(--green);
      animation:none;
    }

    .guard{
      position:absolute;inset:7%;
      border-radius:50%;
      background:radial-gradient(circle at 35% 30%,#ff7070,#c01818);
      box-shadow:0 0 8px var(--redA),0 0 16px var(--redA);
      animation:none;
      display:flex;align-items:center;justify-content:center;
      font-size:clamp(4px,1.5vmin,11px);
      z-index:4;
    }
    .player{
      position:absolute;inset:7%;
      border-radius:50%;
      background:radial-gradient(circle at 38% 32%,#f4c840,var(--gold));
      box-shadow:0 0 7px var(--gold),0 0 14px var(--goldA);
      display:flex;align-items:center;justify-content:center;
      font-size:clamp(4px,1.5vmin,11px);
      z-index:5;
    }

    .dpad{
      background:rgba(4,11,22,.96);
      border-top:1px solid var(--border);
      padding:7px 0 10px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:2px;
      flex-shrink:0;
      position:relative;
      z-index:20;
    }
    .drow{display:flex;gap:2px}
    .dbtn{
      width:38px;height:38px;
      background:#070d1a;
      border:1px solid var(--border);
      border-radius:6px;
      color:var(--txt);
      font-size:12px;
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:all .08s;
      font-family:inherit;
      touch-action:none;
    }
    .dbtn:active{background:#152030;border-color:rgba(212,166,66,.55);color:var(--gold)}
    .dcenter{
      width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    }
    .dcenter div{width:5px;height:5px;border-radius:50%;background:var(--border)}

    .modal-back{
      position:fixed;inset:0;
      background:rgba(2,6,14,.98);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:150;
      padding:12px;
      animation:none;
    }
    .modal{
      background:#070d1a;
      border:1px solid #5a4010;
      border-radius:8px;
      padding:16px;
      max-width:470px;
      width:100%;
      max-height:90vh;
      overflow-y:auto;
      box-shadow:0 0 50px rgba(212,166,66,.10);
      font-family:'Share Tech Mono',monospace;
    }
    .modal.correct{border-color:var(--green);box-shadow:0 0 44px rgba(34,197,94,.14)}
    .modal.wrong{border-color:var(--red);box-shadow:0 0 44px rgba(239,68,68,.14);animation:none}
    .modal-head{border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:12px}
    .modal-title-row{display:flex;justify-content:space-between;align-items:flex-start}
    .modal-label{color:var(--gold);font-size:8px;letter-spacing:3px;margin-bottom:4px}
    .modal-title{color:var(--txt);font-size:14px;font-weight:bold;letter-spacing:1px}
    .modal-timer{text-align:right;flex-shrink:0;margin-left:12px}
    .modal-time{
      color:var(--green);
      font-family:'Orbitron',sans-serif;
      font-size:20px;
      font-weight:900;
      font-variant-numeric:tabular-nums;
      letter-spacing:2px;
    }
    .modal-time.low{color:var(--red);animation:none}
    .tries{display:flex;gap:5px;margin-top:8px;align-items:center}
    .tries span{color:var(--dim);font-size:8px;letter-spacing:2px}
    .try-dot{
      width:9px;height:9px;border-radius:50%;
      background:#182d44;
      transition:all .2s;
    }
    .try-dot.live{
      background:var(--gold);
      box-shadow:0 0 4px rgba(212,166,66,.4);
    }
    .question{
      color:var(--txt);
      font-size:12px;
      line-height:1.95;
      white-space:pre-line;
      background:#030c16;
      border:1px solid var(--border);
      border-radius:5px;
      padding:12px;
      margin-bottom:12px;
    }
    .choice-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
    .choice{
      background:#030c16;
      border:1px solid var(--border);
      border-radius:5px;
      color:var(--txt);
      padding:9px 10px;
      text-align:left;
      font-family:inherit;
      font-size:11px;
      cursor:pointer;
      letter-spacing:.3px;
      transition:all .12s;
    }
    .choice.selected{background:#081a0d;border-color:var(--green);color:var(--green)}
    .text-answer{
      width:100%;
      background:#030c16;
      border:1px solid var(--border);
      border-radius:5px;
      color:var(--gold);
      padding:10px 11px;
      font-family:inherit;
      font-size:12px;
      letter-spacing:2px;
      outline:none;
      text-transform:uppercase;
      margin-bottom:12px;
    }
    .hint-box{
      background:#0e0800;
      border:1px solid #422800;
      border-radius:5px;
      padding:8px 11px;
      margin-bottom:10px;
      color:var(--amber);
      font-size:10px;
      line-height:1.7;
    }
    .wrong-box{
      background:#0d0000;
      border:1px solid #580000;
      border-radius:5px;
      padding:7px 11px;
      margin-bottom:10px;
      color:var(--red);
      font-size:10px;
      line-height:1.65;
    }
    .correct-box{
      color:var(--green);
      text-align:center;
      font-size:13px;
      letter-spacing:3px;
      margin-bottom:10px;
      padding:4px 0;
    }
    .confirm{
      width:100%;
      background:transparent;
      border:1px solid var(--gold);
      border-radius:5px;
      color:var(--gold);
      padding:10px;
      font-family:inherit;
      font-size:10px;
      letter-spacing:3px;
      cursor:pointer;
      transition:all .15s;
      position:relative;
      overflow:hidden;
    }
    .confirm:disabled{
      border-color:var(--border);
      color:var(--dim);
      cursor:not-allowed;
    }
    .confirm:not(:disabled)::after{
      content:"";
      position:absolute;top:0;left:0;width:34%;height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
      transform:translateX(-120%) skewX(-18deg);
    }
    .confirm:not(:disabled):hover::after{animation:sweep .7s ease}

    .intro,.end-screen{
      min-height:100vh;
      background:
        radial-gradient(circle at 50% 30%,rgba(212,166,66,.10),transparent 35%),
        #030a12;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
      font-family:'Share Tech Mono',monospace;
      color:var(--txt);
      position:relative;
      overflow:hidden;
    }
    .intro::before,.end-screen::before{
      content:"";
      position:absolute;inset:0;
      background:
        linear-gradient(90deg,rgba(59,130,246,.025) 1px,transparent 1px),
        linear-gradient(0deg,rgba(59,130,246,.02) 1px,transparent 1px);
      background-size:42px 42px;
      pointer-events:none;
    }
    .intro-card,.end-card{
      text-align:center;
      max-width:460px;
      width:100%;
      position:relative;
      z-index:2;
    }
    .sword-title{
      color:var(--gold);
      font-family:'Orbitron',sans-serif;
      font-size:clamp(24px,6vw,46px);
      letter-spacing:8px;
      font-weight:900;
      margin-bottom:4px;
      text-shadow:0 0 28px rgba(212,166,66,.38);
    }
    .small-caps{
      color:var(--dim);
      font-size:8px;
      letter-spacing:2px;
      margin-bottom:4px;
    }
    .brief-card{
      background:#070d1a;
      border:1px solid var(--border);
      border-radius:7px;
      padding:13px 16px;
      margin-bottom:10px;
      text-align:left;
      box-shadow:0 0 35px rgba(0,0,0,.22);
    }
    .brief-card.gold{border-color:#5a4010}
    .brief-title{
      color:var(--gold);
      font-size:8px;
      letter-spacing:3px;
      margin-bottom:8px;
    }
    .brief-card p,.brief-card div{
      font-size:11px;
      line-height:1.9;
      color:var(--txt);
    }
    .legend{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      justify-content:center;
      font-size:10px;
      color:var(--txt);
    }
    .legend-item{display:flex;align-items:center;gap:6px}

    .final-code-card{
      background:#070d1a;
      border:1px solid #1a5028;
      border-radius:8px;
      padding:16px;
      margin:14px 0 18px;
      box-shadow:0 0 28px rgba(34,197,94,.10);
    }
    .code-digits{
      display:flex;
      justify-content:center;
      gap:10px;
      margin:14px 0;
    }
    .code-digit{
      width:48px;
      height:62px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:2px solid var(--green);
      border-radius:8px;
      color:var(--green);
      background:rgba(34,197,94,.06);
      font-family:'Orbitron',sans-serif;
      font-size:26px;
      font-weight:900;
      box-shadow:0 0 18px rgba(34,197,94,.18);
      animation:none;
    }
        .disarm-input{
      width:100%;
      background:#030c16;
      border:1px solid #1a5028;
      border-radius:6px;
      color:var(--green);
      padding:10px;
      text-align:center;
      font-family:'Orbitron',sans-serif;
      font-size:18px;
      letter-spacing:8px;
      outline:none;
      margin-bottom:10px;
    }
    .access-fill{
      height:4px;
      background:#0b2815;
      border-radius:99px;
      overflow:hidden;
      margin-top:8px;
    }
    .access-fill div{
      height:100%;
      background:var(--green);
      width:0;
    }
    .access-fill.active div{animation:accessBar 1s linear forwards}

    .primary-btn{
      background:transparent;
      border:2px solid var(--gold);
      color:var(--gold);
      padding:12px 34px;
      font-family:inherit;
      font-size:11px;
      letter-spacing:5px;
      cursor:pointer;
      border-radius:5px;
      box-shadow:0 0 22px rgba(212,166,66,.22);
    }

    @media(max-width:760px){
      .top-hud{grid-template-columns:1fr; text-align:center}
      .timer-box{text-align:center}
      .surveillance-row{grid-template-columns:1fr}
      .cam:nth-child(2),.cam:nth-child(3){display:none}
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="scanlines"></div>

  <script>
    const ROWS = 11, COLS = 15;
    const GH = 2 * ROWS + 1;
    const GW = 2 * COLS + 1;
    const TIMER_START = 300;
    const TIMER_MAX = 480;
    const NUM_CP = 10;
    const LOOP_CHANCE = 0.28;
    const THREAT_R = 6;
    const FINAL_CODE = "91483";

    const SP = { r: 1, c: 1 };
    const EP = { r: GH - 2, c: GW - 2 };
    const G0 = { r: GH - 2, c: 1 };

    const P = {
      bg:"#030a12", wall:"#0c1a2c", wallB:"#162438", path:"#040d18",
      gold:"#d4a642", goldD:"#7a5e18", goldA:"rgba(212,166,66,0.26)",
      green:"#22c55e", greenA:"rgba(34,197,94,0.24)",
      red:"#ef4444", redA:"rgba(239,68,68,0.3)",
      amber:"#f59e0b", txt:"#a8c0da", dim:"#344f62",
      border:"#172c42", bGold:"#5a4010",
    };

    const POOL = [
      { type:"choice", label:"INTEL LOCK", q:"What does S.W.O.R.D. stand for?", opts:["Secret Weapons Ops Recon Division","Special World Order Resolution Division","Secret World Order Resolution Division","Strategic Worldwide Ops & Response Div."], ans:2, hint:"Agents who RESOLVE global crises — in SECRET." },
      { type:"choice", label:"ALGEBRA", q:"Solve for x:\\n\\n         3x + 7 = 25", opts:["x = 4","x = 6","x = 7","x = 9"], ans:1, hint:"Subtract 7 from both sides, then divide by 3." },
      { type:"choice", label:"SEQUENCE", q:"What comes next?\\n\\n    2 → 4 → 8 → 16 → __", opts:["24","28","32","36"], ans:2, hint:"Each number doubles the one before it." },

    let state = {
      screen: "intro",
      game: null,
      pSel: null,
      pInp: "",
      pSt: "idle",
      flash: "",
      ntfy: "",
      finalInput: "",
      finalStatus: "idle",
    };

    let timerId = null;
    let flashId = null;
    let ntfyId = null;
    let touchStart = null;

    const app = document.getElementById("app");

    function shuffle(arr){
      const a = [...arr];
      for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
      }
      return a;
    }

    function genMaze(){
      const g = Array.from({length:GH},()=>Array(GW).fill(0));
      for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) g[2*r+1][2*c+1]=1;
      const vis = Array.from({length:ROWS},()=>Array(COLS).fill(false));
      function carve(r,c){
        vis[r][c]=true;
        shuffle([[0,1],[0,-1],[1,0],[-1,0]]).forEach(([dr,dc])=>{
          const nr=r+dr,nc=c+dc;
          if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&!vis[nr][nc]){
            g[2*r+1+dr][2*c+1+dc]=1;
            carve(nr,nc);
          }
        });
      }
      carve(0,0);
      for(let r=1;r<GH-1;r++){
        for(let c=1;c<GW-1;c++){
          if(g[r][c]!==0) continue;
          const hWall = r%2===0 && c%2===1 && g[r-1][c]===1 && g[r+1][c]===1;
          const vWall = r%2===1 && c%2===0 && g[r][c-1]===1 && g[r][c+1]===1;
          if((hWall||vWall) && Math.random()<LOOP_CHANCE) g[r][c]=1;
        }
      }
      return g;
    }

    function bfs(grid, from, to){
      const vis = new Set([`${from.r},${from.c}`]);
      const q = [{pos:from,path:[from]}];
      while(q.length){
        const {pos,path}=q.shift();
        if(pos.r===to.r && pos.c===to.c) return path;
        for(const [dr,dc] of [[0,1],[0,-1],[1,0],[-1,0]]){
          const np={r:pos.r+dr,c:pos.c+dc};
          const k=`${np.r},${np.c}`;
          if(np.r>=0&&np.r<GH&&np.c>=0&&np.c<GW&&grid[np.r][np.c]!==0&&!vis.has(k)){
            vis.add(k); q.push({pos:np,path:[...path,np]});
          }
        }
      }
      return [];
    }

    function buildThreatMap(grid, guardPos){
      const map = new Map([[`${guardPos.r},${guardPos.c}`,0]]);
      const q = [{pos:guardPos,d:0}];
      while(q.length){
        const {pos,d}=q.shift();
        if(d>=THREAT_R) continue;
        for(const [dr,dc] of [[0,1],[0,-1],[1,0],[-1,0]]){
          const np={r:pos.r+dr,c:pos.c+dc};
          const k=`${np.r},${np.c}`;
          if(np.r>=0&&np.r<GH&&np.c>=0&&np.c<GW&&grid[np.r][np.c]!==0&&!map.has(k)){
            map.set(k,d+1); q.push({pos:np,d:d+1});
          }
        }
      }
      return map;
    }

    function initGame(){
      const grid = genMaze();
      const special = new Set([`${SP.r},${SP.c}`,`${EP.r},${EP.c}`,`${G0.r},${G0.c}`]);
      const pool = [];
      for(let r=1;r<GH-1;r++){
        for(let c=1;c<GW-1;c++){
          const k=`${r},${c}`;
          const d = Math.abs(r-SP.r)+Math.abs(c-SP.c);
          if(grid[r][c]===1 && !special.has(k) && d>3) pool.push({r,c});
        }
      }
      const cpPos = shuffle(pool).slice(0,NUM_CP);
      const cpMap = {};
      cpPos.forEach((p,i)=>{ cpMap[`${p.r},${p.c}`]=i+1; });
      const puzzles = shuffle(POOL).slice(0,NUM_CP);
      return {
        grid, cpMap, puzzles,
        playerPos:{...SP}, guardPos:{...G0},
        cleared:new Set(), timer:TIMER_START,
        activeCp:null, tries:3, hintShown:false
      };
    }

    function startGame(){
      clearInterval(timerId);
      state = {screen:"game", game:initGame(), pSel:null, pInp:"", pSt:"idle", flash:"", ntfy:"", finalInput:"", finalStatus:"idle"};
      render();
      timerId = setInterval(tick,1000);
    }

    function tick(){
      if(state.screen !== "game" || !state.game) return;
      state.game.timer -= 1;
      if(state.game.timer <= 0){
        state.screen = "lose";
        clearInterval(timerId);
        render();
        return;
      }
      updateTimerDisplays();
    }

    function updateTimerDisplays(){
      if(!state.game) return;
      const timer = state.game.timer;
      const mm = String(Math.floor(timer/60)).padStart(2,"0");
      const ss = String(timer%60).padStart(2,"0");
      const timerClr = timer>120 ? P.green : timer>60 ? P.amber : P.red;
      const pct = Math.min((timer/TIMER_MAX)*100,100);

      const mainTimer = document.querySelector(".timer");
      if(mainTimer){
        mainTimer.textContent = `⏱ ${mm}:${ss}`;
        mainTimer.style.color = timerClr;
      }

      const fill = document.querySelector(".timer-fill");
      if(fill){
        fill.style.width = `${pct}%`;
        fill.style.background = timerClr;
      }

      const modalTime = document.querySelector(".modal-time");
      if(modalTime){
        modalTime.textContent = `${mm}:${ss}`;
      }
    }

    function showFlash(m){
      state.flash = m;
      clearTimeout(flashId);
      flashId = setTimeout(()=>{state.flash=""; render();},2800);
      render();
    }

    function showNtfy(m){
      state.ntfy = m;
      clearTimeout(ntfyId);
      ntfyId = setTimeout(()=>{state.ntfy=""; render();},2400);
      render();
    }

    function move(dr,dc){
      const game = state.game;
      if(!game || game.activeCp !== null || state.screen !== "game") return;
      const {playerPos, grid, cpMap, cleared, guardPos} = game;
      const nr = playerPos.r + dr, nc = playerPos.c + dc;
      if(nr<0||nr>=GH||nc<0||nc>=GW||grid[nr][nc]===0) return;
      const npos = {r:nr,c:nc};

      if(guardPos.r===npos.r && guardPos.c===npos.c){ state.screen="lose"; clearInterval(timerId); render(); return; }

      const path = bfs(grid, guardPos, npos);
      const ng = path.length>1 ? path[1] : guardPos;
      const caught = ng.r===npos.r && ng.c===npos.c;

      if(nr===EP.r && nc===EP.c){
        game.playerPos = npos;
        game.guardPos = ng;
        if(cleared.size===NUM_CP) {
          state.screen = "finalCode";
          clearInterval(timerId);
        } else showFlash(`⚠ CLEAR ALL ${NUM_CP} CHECKPOINTS FIRST`);
        if(caught) { state.screen="lose"; clearInterval(timerId); }
        render(); return;
      }

      const cpIdx = cpMap[`${nr},${nc}`];
      if(cpIdx && !cleared.has(cpIdx)){
        game.playerPos = npos;
        game.guardPos = ng;
        game.activeCp = cpIdx;
        game.tries = 3;
        game.hintShown = false;
        state.pSel = null;
        state.pInp = "";
        state.pSt = "idle";
        if(caught) { state.screen="lose"; clearInterval(timerId); }
        render(); return;
      }

      game.playerPos = npos;
      game.guardPos = ng;
      if(caught){ state.screen="lose"; clearInterval(timerId); }
      render();
    }

    function submitPuzzle(){
      const game = state.game;
      if(!game || game.activeCp===null) return;
      const cp = game.activeCp;
      const p = game.puzzles[cp-1];
      const ok = p.type==="choice"
        ? state.pSel===p.ans
        : p.ans.some(a => a.toLowerCase() === state.pInp.trim().toLowerCase());

      if(ok){
        state.pSt = "correct";
        showModalResult("correct", "✓ ACCESS GRANTED — +5s ADDED");
        setTimeout(()=>{
          game.cleared.add(cp);
          game.activeCp = null;
          game.timer = Math.min(game.timer+5, TIMER_MAX);
          state.pSt = "idle";
          state.pSel = null;
          state.pInp = "";
          state.ntfy = `✓ CHECKPOINT ${cp} CLEARED +5s ⏱`;
          clearTimeout(ntfyId);
          ntfyId = setTimeout(()=>{state.ntfy=""; render();},2400);
          render();
        },900);
      } else {
        state.pSt = "wrong";
        let gp = game.guardPos;
        for(let i=0;i<2;i++){
          const p2 = bfs(game.grid,gp,game.playerPos);
          if(p2.length>1) gp = p2[1]; else break;
        }
        game.guardPos = gp;
        if(gp.r===game.playerPos.r && gp.c===game.playerPos.c){
          setTimeout(()=>{state.screen="lose";clearInterval(timerId);render();},700);
        }
        const nt = game.tries - 1;
        const newHint = nt <= 0;
        game.tries = newHint ? 3 : nt;
        game.hintShown = game.hintShown || newHint;
        showModalResult("wrong", `✗ INCORRECT — GUARD +2 STEPS${!game.hintShown ? ` · ${game.tries} WRONG UNTIL HINT` : ""}`);
        setTimeout(()=>{
          state.pSt="idle";
          if(newHint) render();
          else clearModalResult();
        },850);
      }
    }

    function showModalResult(type, message){
      const modal = document.querySelector(".modal");
      if(!modal) return;
      modal.classList.remove("correct","wrong");
      modal.classList.add(type);

      const oldMsg = document.getElementById("inlineResult");
      if(oldMsg) oldMsg.remove();

      const submit = document.getElementById("submitPuzzle");
      const msg = document.createElement("div");
      msg.id = "inlineResult";
      msg.className = type === "correct" ? "correct-box" : "wrong-box";
      msg.textContent = message;
      if(submit){
        submit.insertAdjacentElement("beforebegin", msg);
        submit.disabled = true;
      } else {
        modal.appendChild(msg);
      }
    }

    function clearModalResult(){
      const modal = document.querySelector(".modal");
      if(modal) modal.classList.remove("correct","wrong");
      const msg = document.getElementById("inlineResult");
      if(msg) msg.remove();
      const submit = document.getElementById("submitPuzzle");
      if(submit) submit.disabled = false;
    }

    function confirmFinalCode(){
      if(state.finalInput === FINAL_CODE){
        state.finalStatus = "correct";
        render();
        setTimeout(()=>{state.screen="win"; render();},1100);
      } else {
        state.finalStatus = "wrong";
        render();
        setTimeout(()=>{state.finalStatus="idle"; state.finalInput=""; render();},900);
      }
    }

    function esc(s){
      return String(s).replace(/\\n/g, "\n").replace(/[&<>'"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;" }[c]));
    }

    function render(){
      if(state.screen==="intro") return renderIntro();
      if(state.screen==="lose") return renderLose();
      if(state.screen==="finalCode") return renderFinalCode();
      if(state.screen==="win") return renderWin();
      if(state.screen==="game") return renderGame();
    }

                const k = `${r},${c}`;

                const cpOk = cpI && cleared.has(cpI);
                const isEx = r===EP.r && c===EP.c;

                else cls += "path";

              <div class="dcenter"><div></div></div>
              <button class="dbtn" data-m="0,1">▶</button>
            </div>
            <button class="dbtn" data-m="1,0">▼</button>
            <div style="color:var(--dim);font-size:7px;letter-spacing:1px;margin-top:3px">Arrow keys / WASD · Swipe</div>
          </div>

          ${activeCp && puzzles[activeCp-1] ? renderPuzzleModal(puzzles[activeCp-1],activeCp,tries,hintShown,timer) : ""}
        </div>
      `;

      document.getElementById("resetBtn").onclick = startGame;
      document.querySelectorAll(".dbtn").forEach(btn=>{
        btn.onpointerdown = () => {
          const [dr,dc] = btn.dataset.m.split(",").map(Number);
          move(dr,dc);
        };
      });

      const mazeWrap = document.getElementById("mazeWrap");
      mazeWrap.ontouchstart = e => { touchStart = {x:e.touches[0].clientX,y:e.touches[0].clientY}; };
      mazeWrap.ontouchend = e => {
        if(!touchStart || state.game?.activeCp !== null) return;
        const dx = e.changedTouches[0].clientX - touchStart.x;
        const dy = e.changedTouches[0].clientY - touchStart.y;
        if(Math.max(Math.abs(dx),Math.abs(dy)) < 22) return;
        Math.abs(dx)>Math.abs(dy) ? move(0,dx>0?1:-1) : move(dy>0?1:-1,0);
        touchStart = null;
      };

      if(activeCp && puzzles[activeCp-1]){
        wirePuzzleModal(puzzles[activeCp-1]);
      }
    }

    function renderPuzzleModal(p,n,tries,hint,timer){
      const ok = state.pSt === "correct";
      const wrong = state.pSt === "wrong";
      const can = p.type==="choice" ? state.pSel!==null : state.pInp.trim().length>0;
      const mm = String(Math.floor(timer/60)).padStart(2,"0");
      const ss = String(timer%60).padStart(2,"0");
      const low = timer <= 30;
      return `
        <div class="modal-back">
          <div class="modal ${ok ? "correct" : wrong ? "wrong" : ""}">
            <div class="modal-head">
              <div class="modal-title-row">
                <div>
                  <div class="modal-label">S.W.O.R.D. — CP ${n}/${NUM_CP} — ${esc(p.label)}</div>
                  <div class="modal-title">${esc(p.label)}</div>
                </div>
                <div class="modal-timer">
                  <div class="modal-time ${low ? "low" : ""}">${mm}:${ss}</div>
                  <div style="font-size:7px;color:var(--dim);letter-spacing:1px">⏱ RUNNING</div>
                </div>
              </div>
              <div class="tries">
                <span>ATTEMPTS:</span>
                ${[1,2,3].map(i=>`<div class="try-dot ${i<=tries ? "live" : ""}"></div>`).join("")}
              </div>
            </div>

            <div class="question">${esc(p.q)}</div>

            ${p.type==="choice" ? `
              <div class="choice-list">
                ${p.opts.map((opt,i)=>`<button class="choice ${state.pSel===i ? "selected" : ""}" data-choice="${i}">${["A","B","C","D"][i]}. ${esc(opt)}</button>`).join("")}
              </div>
            ` : `
              <input id="textAnswer" class="text-answer" value="${esc(state.pInp)}" placeholder="TYPE YOUR ANSWER..." ${ok ? "disabled" : ""}/>
            `}

            ${hint ? `<div class="hint-box">💡 HINT: ${esc(p.hint)}</div>` : ""}
            ${wrong ? `<div class="wrong-box">✗ INCORRECT — GUARD +2 STEPS${!hint ? ` · ${tries} WRONG UNTIL HINT` : ""}</div>` : ""}
            ${ok ? `<div class="correct-box">✓ ACCESS GRANTED — +5s ADDED</div>` : ""}
            ${!ok ? `<button id="submitPuzzle" class="confirm" ${can ? "" : "disabled"}>CONFIRM ANSWER ▶</button>` : ""}
          </div>
        </div>
      `;
    }

    function wirePuzzleModal(p){
      if(p.type==="choice"){
        document.querySelectorAll(".choice").forEach(btn=>{
          btn.onclick = () => {
            state.pSel = Number(btn.dataset.choice);
            document.querySelectorAll(".choice").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
            const submit = document.getElementById("submitPuzzle");
            if(submit) submit.disabled = false;
          };
        });
      } else {
        const input = document.getElementById("textAnswer");
        if(input){
          input.oninput = e => {
            state.pInp = e.target.value;
            const submit = document.getElementById("submitPuzzle");
            if(submit) submit.disabled = state.pInp.trim().length === 0;
          };
          input.onkeydown = e => { if(e.key==="Enter") submitPuzzle(); };
        }
      }
      const submit = document.getElementById("submitPuzzle");
      if(submit) submit.onclick = submitPuzzle;
    }

    function renderFinalCode(){
      app.innerHTML = `
        <main class="end-screen">
          <div class="end-card">
            <div class="small-caps" style="color:var(--green);letter-spacing:4px;margin-bottom:12px">✓ EXTRACTION POINT REACHED</div>
            <div class="sword-title">S.W.O.R.D.</div>

            <div class="final-code-card">
              <div class="brief-title" style="color:var(--green);text-align:center">FINAL BOMB DISARM CODE</div>
              <p style="font-size:11px;line-height:1.8;color:var(--txt);margin:0">
                All checkpoints secured. The facility terminal has released the final five single-digit code.
              </p>

              <div class="code-digits">
                ${FINAL_CODE.split("").map(d=>`<div class="code-digit">${d}</div>`).join("")}
              </div>

              <div style="color:var(--dim);font-size:10px;line-height:1.8;margin-top:10px">
                Enter this code on the physical bomb device.
              </div>
            </div>

            <button class="primary-btn" id="playAgainFromCode" style="padding:10px 24px;font-size:10px;letter-spacing:3px">↺ PLAY AGAIN</button>
          </div>
        </main>
      `;
      document.getElementById("playAgainFromCode").onclick = startGame;
    }

    function renderWin(){
      app.innerHTML = `
        <main class="end-screen">
          <div class="end-card">
            <div style="color:var(--green);font-size:10px;letter-spacing:4px;margin-bottom:12px">✓ ✓ ✓ MISSION ACCOMPLISHED ✓ ✓ ✓</div>
            <div class="sword-title" style="animation:defused 1.2s ease forwards">DEFUSED</div>

            <div class="brief-card" style="border-color:#1a5028;text-align:center;box-shadow:0 0 22px rgba(34,197,94,.10)">
              <p style="color:var(--green);margin:0">Outstanding work. All 10 checkpoints cleared, the exit reached, and the bomb disarmed.</p>
            </div>

            <div class="final-code-card">
              <div class="brief-title" style="color:var(--green);text-align:center">CONFIRMED DISARM CODE</div>
              <div class="code-digits">
                ${FINAL_CODE.split("").map(d=>`<div class="code-digit">${d}</div>`).join("")}
              </div>
            </div>

            <div class="brief-card" style="text-align:center">
              <p>Want to know more about the world of SWORD?<br><span style="color:var(--gold)">Ask us about <em style="color:var(--txt)">The World's Spy!</em></span></p>
            </div>

            <button class="primary-btn" id="playAgain">↺ PLAY AGAIN</button>
          </div>
        </main>
      `;
      document.getElementById("playAgain").onclick = startGame;
    }

    function renderLose(){
      app.innerHTML = `
        <main class="end-screen">
          <div class="end-card">
            <div style="color:var(--red);font-size:10px;letter-spacing:4px;margin-bottom:12px;animation:none">✗ ✗ ✗ MISSION FAILED ✗ ✗ ✗</div>
            <div class="sword-title">S.W.O.R.D.</div>

            <div class="brief-card" style="border-color:#580000;text-align:center">
              <p style="color:var(--red);margin:0">Compromised. Use the maze's alternate routes to outmanoeuvre the guard — when it commits to one path, slip through another.</p>
            </div>

            <button class="primary-btn" id="retryBtn">↺ RETRY MISSION</button>
          </div>
        </main>
      `;
      document.getElementById("retryBtn").onclick = startGame;
    }

    window.addEventListener("keydown", e => {
      const MAP = {ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],w:[-1,0],s:[1,0],a:[0,-1],d:[0,1],W:[-1,0],S:[1,0],A:[0,-1],D:[0,1]};
      if(MAP[e.key] && state.screen==="game" && (!state.game || state.game.activeCp===null)){
        e.preventDefault();
        move(...MAP[e.key]);
      }
    });

    render();
  </script>
</body>
</html>
